mmitments. You can't always be available to monitor the market."},{title:"03. Emotional Trading Decisions",body:"Fear, impatience and impulsive decisions can get in the way of following a trading strategy."},{title:"04. Missed Trading Opportunities",body:"While you're away from your charts, the market continues moving. Manual trading requires your attention and availability."}],closing:["What if you could automate your gold-trading routine instead of manually handling every trading opportunity?","You don't necessarily need more time in front of your charts. You need the right tools to make your trading routine more convenient."]},section3Solution:{overline:"Introducing the solution",heading:"Meet GOLD TITAN. Your Automated Gold-Trading Companion.",paragraphs:["GOLD TITAN is an automated trading software solution developed for the XAUUSD market.","Designed to work with MetaTrader 4 and MetaTrader 5, GOLD TITAN helps automate its programmed trading strategy, reducing the need for constant manual trade execution.","Whether you're balancing a career, running a business or learning the Forex market, GOLD TITAN gives you access to automated trading technology designed around your time."],appealingHeading:"WHAT MAKES GOLD TITAN APPEALING?",appealingItems:[{lead:"Gold-focused automation:",detail:"A dedicated solution for the XAUUSD market."},{lead:"Automated execution:",detail:"The software follows its programmed trading rules."},{lead:"MT4 and MT5 compatibility:",detail:"Compatible versions for both supported platforms."},{lead:"Convenient setup:",detail:"No separate VPS purchase or configuration required."},{lead:"Flexible subscription:",detail:"Access the software through a straightforward monthly subscription."}],cta:"DISCOVER GOLD TITAN",subCtaNote:"Your time matters. Explore a more automated approach to gold trading."},section4HowItWorks:{overline:"How it works",heading:"Getting Started with GOLD TITAN Is Simple.",intro:"Getting started doesn't have to be complicated. Follow the setup process and let the software handle its programmed trading activities.",steps:[{title:"STEP 1 - Choose Your Trading Platform",body:"Select the compatible GOLD TITAN version for your MetaTrader 4 or MetaTrader 5 environment."},{title:"STEP 2 - Subscribe and Get Connected",body:"Complete your subscription and follow the instructions provided to connect GOLD TITAN to your trading account."},{title:"STEP 3 - Configure Your Trading Settings",body:"Review the available settings and configure the supported risk parameters according to your preferences."},{title:"STEP 4 - Activate and Monitor",body:"Once activated, GOLD TITAN can execute its programmed strategy. You can review your account activity and continue monitoring your trading account."}],requirementsHeading:"IMPORTANT ACCOUNT REQUIREMENTS",requirements:["Minimum trading account balance: $250.","Compatible with supported live MT4 and MT5 accounts.","Demo accounts are not supported.","No separate VPS is required."],cta:"GET STARTED TODAY"},section5WhyGoldTitan:{overline:"Why GOLD TITAN?",heading:"Why Consider GOLD TITAN?",intro:"We're bringing gold-trading automation and convenience together in one software solution.",items:[{title:"01. Dedicated Gold Trading",body:"GOLD TITAN is designed specifically for XAUUSD traders."},{title:"02. MT4 and MT5 Compatibility",body:"Choose the compatible version for your preferred MetaTrader platform."},{title:"03. Automated Trading Execution",body:"Let predefined trading rules guide the software's trading activity instead of manually executing every trade."},{title:"04. Spend Less Time Watching Charts",body:"Reduce the amount of time you spend monitoring the market and manually executing trades."},{title:"05. No Separate VPS Required",body:"There's no need to purchase or configure an additional VPS. The required setup has already been handled for GOLD TITAN."},{title:"06. Accessible Subscription Model",body:"Get started with a monthly subscription of just $50, with additional savings available through our multi-month offer."},{title:"07. Designed with Developing Traders in Mind",body:"Whether you're a beginner learning about automated trading or an intermediate trader looking for additional tools, GOLD TITAN gives you a way to explore gold-trading automation."}],closing:"GOLD TITAN is about making automated gold trading more accessible, convenient and straightforward."},section6Technology:{overline:"Get to know the technology",heading:"Before You Subscribe, Know Exactly What You're Getting.",intro:"GOLD TITAN is a new automated gold-trading solution, and we want you to understand the software before making your decision.",specs:[{title:"A Dedicated XAUUSD Trading Solution",body:"GOLD TITAN focuses on the gold market rather than presenting itself as an all-market trading robot."},{title:"Two Supported Platforms",body:"Choose between the compatible MT4 and MT5 versions."},{title:"A Ready-to-Use Setup",body:"You don't need to source or configure a separate VPS. The required GOLD TITAN setup has already been handled."},{title:"A Clearly Defined Account Requirement",body:"A minimum live trading balance of $250 is required before the bot can start trading."},{title:"A Straightforward Subscription",body:"Pay $50 for one month of software access, or save 20% by subscribing for two or more months upfront."}],transparencyHeading:"OUR APPROACH TO TRANSPARENCY",transparencyParagraphs:["We want you to understand the product, its functionality, its requirements and its limitations.","As a newly launched product, we are not presenting unverified trading results or manufactured customer testimonials as evidence of performance.","Forex and gold trading involve risk. GOLD TITAN does not guarantee profitable trades or eliminate the possibility of losses."],cta:"EXPLORE GOLD TITAN"},section7Pricing:{overline:"Pricing, bonuses and launch availability",heading:"Get Started with GOLD TITAN for Just $50.",intro:"Your opportunity to explore automated gold trading starts here. Choose your subscription, enjoy our introductory launch offers and get access to GOLD TITAN.",standardPlan:{columnHeaderLeft:"STANDARD MONTHLY SUBSCRIPTION",columnHeaderRight:"PRICE",name:"GOLD TITAN - one month of software access",price:"$50 / month",inclusions:"Includes compatible MT4 or MT5 version and installation/setup instructions.",cta:"SUBSCRIBE NOW"},bonus01:{title:"BONUS 01 - FIRST FIVE SUBSCRIBERS",subheadline:"GET 30% OFF YOUR FIRST MONTH!",body:"We're rewarding our first five subscribers with an exclusive launch discount. Regular price: $50. Your discounted price: $35. You save $15! This offer is available only to the first five qualifying subscribers."},bonus02:{title:"BONUS 02 - MULTI-MONTH SUBSCRIPTION",subheadline:"COMMIT TO MORE MONTHS. SAVE 20%.",body:"Pay for two or more months upfront and receive 20% off the total subscription price. That is $40 per month when you subscribe for multiple months.",tableHeaders:["TERM","STANDARD PRICE","DISCOUNTED PRICE","SAVINGS"],rows:[{term:"2 months",termMonths:2,standard:"$100",discounted:"$80",savings:"$20"},{term:"3 months",termMonths:3,standard:"$150",discounted:"$120",savings:"$30"},{term:"6 months",termMonths:6,standard:"$300",discounted:"$240",savings:"$60"}]},launchDetailsHeading:"Bonus access and launch availability",bonus03:{title:"BONUS 03 - ONE EXTRA MONTH ON US",subheadline:"A LITTLE MORE CONFIDENCE IN YOUR FIRST MONTH.",body:"If your qualifying GOLD TITAN trades do not generate a net profit during your first 30 days, you will receive one additional month of GOLD TITAN software access at no additional subscription charge.",disclaimer:"This is an extension of your software subscription, not a refund or compensation for trading losses. Trading capital remains at risk, and no trading profit is guaranteed. Eligibility and calculation rules will be provided in the offer terms."},launchSlots:{title:"YOUR EARLY-ACCESS LAUNCH SLOTS",subheadline:"ONLY 20 LAUNCH SUBSCRIPTIONS AVAILABLE!",body:"We're opening just 20 early-access subscription places for the GOLD TITAN launch. Once all 20 places have been claimed, the introductory launch offer will close.",remainingSuffix:"/ 20 SLOTS REMAINING",claimedSuffix:"SLOTS CLAIMED",cta:"CLAIM YOUR SUBSCRIPTION"},promotionalTerms:"Promotional terms: The 30% discount applies to the first month for the first five qualifying subscribers. The 20% discount applies to subscriptions of two or more months paid upfront. The extra-month offer is subject to its published eligibility conditions."},section8Faqs:{overline:"Frequently asked questions",heading:"Frequently asked questions",items:[{question:"1. What is GOLD TITAN?",answer:"GOLD TITAN is an automated gold-trading software solution designed to help traders automate its programmed trading strategy on the XAUUSD (Gold) market. It works with compatible MetaTrader 4 and MetaTrader 5 environments."},{question:"2. Who is GOLD TITAN designed for?",answer:"GOLD TITAN is designed primarily with beginner and intermediate Forex traders in mind, particularly individuals aged 21-35 who are interested in gold trading and automated trading technology. However, anyone considering using the software should understand the risks associated with Forex and leveraged trading."},{question:"3. Does GOLD TITAN work with MT4 and MT5?",answer:"Yes. GOLD TITAN has compatible versions for both MetaTrader 4 and MetaTrader 5. You can select the version that corresponds with your supported trading platform."},{question:"4. Do I need previous Forex trading experience?",answer:"You don't necessarily need to be an experienced trader to learn how to use GOLD TITAN. However, we recommend understanding the basics of Forex trading, how MetaTrader works and the risks associated with gold trading before subscribing."},{question:"5. Does GOLD TITAN trade automatically?",answer:"GOLD TITAN is designed to automate its programmed gold-trading strategy. It executes the trading functions supported by its software configuration. You should still monitor your trading account and understand how the system operates."},{question:"6. Does GOLD TITAN guarantee profits?",answer:"No. GOLD TITAN does not guarantee profits. The Forex and gold markets are unpredictable, and automated trading systems can experience losing trades and drawdowns. You can lose some or all of your trading capital. Always understand the risks before trading."},{question:"7. What happens if I don't make a profit during my first month?",answer:"GOLD TITAN offers a conditional first-month subscription extension. If your qualifying GOLD TITAN trades do not produce a net profit during the first 30 days, you may qualify for one additional month of software access at no additional subscription charge. This offer does not refund or compensate you for trading losses, and it does not guarantee future profits. Please consult the full offer terms for eligibility and performance calculations."},{question:"8. How much does GOLD TITAN cost?",answer:"The standard GOLD TITAN monthly subscription costs $50 per month. The first five qualifying subscribers receive 30% off their first month and pay $35 instead of $50. Customers who pay for two or more months upfront receive 20% off the total subscription cost. For example, two months normally cost $100, but with the multi-month discount, you pay $80."},{question:"9. How much money do I need in my trading account before GOLD TITAN can start trading?",answer:"You need a minimum live trading account balance of $250 before GOLD TITAN can start trading. This is the minimum account-funding requirement, not a guarantee that $250 is sufficient for every risk setting or suitable for every trader. Trading with leverage involves significant financial risk, and you can lose your trading capital."},{question:"10. Can I use GOLD TITAN on a demo account?",answer:"No. GOLD TITAN is not available for use on demo accounts. A supported live trading account is required to use the software."},{question:"11. Do I need a VPS to run GOLD TITAN?",answer:"No. You do not need to purchase or configure a separate VPS. The required setup has already been handled for GOLD TITAN, making the setup process more convenient for subscribers."},{question:"12. What happens when my subscription expires?",answer:"When your GOLD TITAN subscription expires, the bot is disconnected from your trading account and stops running. To continue using GOLD TITAN, you'll need to renew your subscription. Please remember to check and manage any open trades before your subscription expires. Positions may remain open with your broker even after the bot is disconnected and may no longer be managed by GOLD TITAN."}]},finalCta:{heading:"Your Time Is Valuable. Make Your Trading Routine More Convenient.",paragraphs:["You don't have to spend every waking hour watching the gold market.","Discover a more automated approach to XAUUSD trading with GOLD TITAN.","Whether you're just beginning your trading journey or looking for additional automation tools, your next step starts here."],cta:"GET STARTED WITH GOLD TITAN",tagline:"GOLD TITAN - Gold Trading. Automated. Simplified."},riskDisclosure:{heading:"RISK DISCLOSURE",body:"Forex and leveraged gold trading involves substantial risk and may not be suitable for everyone. You can lose some or all of your trading capital. Automated trading does not eliminate market risk, and results can be affected by market conditions, spreads, slippage, commissions, swaps, broker execution and technical interruptions. Historical performance does not guarantee future results. Only trade with money you can afford to lose."}};function qd(){return o.jsx("div",{role:"region","aria-label":"Launch announcement",className:"relative z-50 border-b border-[#E7CF8B]/15 bg-[#0B0A08] px-4 py-2.5 text-center",children:o.jsxs("div",{className:"mx-auto flex max-w-[1240px] items-center justify-center gap-2.5 text-xs sm:text-[13px] leading-snug text-[#F5F2EA]",children:[o.jsx("span"
